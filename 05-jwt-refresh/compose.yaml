name: auth05-jwt-refresh
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8005}:8000"
    environment:
      DATABASE_PATH: /app/db.sqlite3
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-demo-only-change-in-production}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-auth05-demo-signing-key-change-for-production-32-bytes}
      ACCESS_SECONDS: ${ACCESS_SECONDS:-60}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-604800}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5175}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5175}
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--locked",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/activities', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5175}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8005}
    depends_on:
      backend:
        condition: service_healthy
