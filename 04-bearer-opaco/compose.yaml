name: auth04-bearer-opaco
services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8004}:8000"
    environment:
      DATABASE_PATH: /app/db.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-auth04-only-development-change-for-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      OPAQUE_SECONDS: ${OPAQUE_SECONDS:-3600}
    volumes:
      - ./backend:/app
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "--frozen",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/activities')",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8004}
    depends_on:
      backend:
        condition: service_healthy
